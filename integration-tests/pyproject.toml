[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-tests"
version = "0.14.0"
description = "Integration tests for the eCoSim project"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
dependencies = [
    "dask[distributed]==2026.7.0",
    "docker==7.1.0",
    "ecosim-client-fmu-v3==0.14.0",
    "ecosim-client-fmu-v2==0.14.0",
    "ecosim-client-matlab==0.14.0",
    "ecosim-client-pyro5==0.14.0",
    "ecosim-common==0.14.0",
    "ecosim-common-fmpy==0.14.0",
    "ecosim-server==0.14.0",
    "ecosim-hpc==0.14.0",
    "ecosim-test-common==0.14.0",
    "mypy==2.3.0",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-mock==3.15.1",
    "pytest==9.1.1",
    "testcontainers[postgres]==4.13.0",
    "types-docker==7.1.0.20260518",
    "websockets==16.0",
    "psycopg[binary]==3.3.4",
    "multiprocessing-logging==0.3.4",
    "lxml==6.1.3"
]

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }
ecosim-common-fmpy = { path = "../ecosim-common-fmpy", editable = true }
ecosim-server = { path = "../ecosim-server", editable = true }
ecosim-client-fmu-v3 = { path = "../ecosim-client-fmu-v3", editable = true }
ecosim-client-fmu-v2 = { path = "../ecosim-client-fmu-v2", editable = true }
ecosim-client-matlab = { path = "../ecosim-client-matlab", editable = true }
ecosim-client-pyro5 = { path = "../ecosim-client-pyro5", editable = true }
ecosim-hpc = { path = "../ecosim-hpc", editable = true }
ecosim-test-common = { path = "../ecosim-test-common", editable = true }

[tool.mypy]
mypy_path = [
    "../ecosim-common",
    "../ecosim-common-fmpy",
    "../ecosim-server",
    "../ecosim-client-fmu-v2",
    "../ecosim-client-fmu-v3",
    "../ecosim-client-matlab",
    "../ecosim-client-pyro5",
    "../ecosim-hpc",
    "../ecosim-test-common",
]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Pyro5 is not typed
    "Pyro5",
    "Pyro5.*",
    # cloudpickle and testcontainers are not typed
    "cloudpickle",
    "cloudpickle.*",
    "testcontainers",
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
timeout = 120
testpaths = ["integration_tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
    "--ignore=integration_tests/locally",
    # a plain run leaves the performance tests out; '-m performance' on the command line selects them
    "-m", "not performance",
]
markers = [
    "integration: every test that is not a performance test",
    "performance: compares the run times with the expected times",
]
log_level = "DEBUG"

version: '3.9'

services:

  db:
    container_name: eco-sim-db
    image: timescale/timescaledb:latest-pg16
    restart: always
    # shared memory limit
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: integration_test
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:Z

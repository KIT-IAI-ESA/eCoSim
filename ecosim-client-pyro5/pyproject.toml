[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-client-pyro"
version = "0.14.0"
description = "The pyro client for the eCoSim project"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: FMU client",
#    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "art==6.5",
    "ecosim-common==0.14.0",
    "setuptools==83.0.0",
    "pydantic==2.13.4",
    "Pyro5==5.15",
    "pandapower>=3.4.0",
]

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "mypy==2.2.0",
    "uv==0.11.28",
]

[tool.mypy]
mypy_path = "../ecosim-common"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore art library (not typed)
    "art",
    # Ignore Pyro5 library (not typed)
    "Pyro5",
    "Pyro5.*",
]
ignore_missing_imports = true


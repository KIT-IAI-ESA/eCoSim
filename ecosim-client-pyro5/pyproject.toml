[build-system]
requires = ["setuptools==80.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-client-pyro"
version = "0.9.2"
description = "The pyro client for the eCoSim project"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: FMU client",
#    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "art==6.5",
    "ecosim-common>=0.9.0",
    "setuptools==80.8.0",
    "pydantic==2.12.4",
    "Pyro5==5.15",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "pytest-html==4.1.1",
    "mypy==1.15.0",
]


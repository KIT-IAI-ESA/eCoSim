[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-client-pyro5"
version = "0.14.0"
description = "The pyro client for the eCoSim project"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
maintainers = [
    { name = "eASiMOV", email = "easimov@iai.kit.edu" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "art==6.5",
    "ecosim-common==0.14.0",
    "pydantic==2.13.4",
    "Pyro5==5.15",
    "pandapower>=3.4.0",
]

[project.scripts]
ecosim-client-pyro5 = "ecosim_client_pyro5.main:main"

[project.urls]
Documentation = "https://ecosim.easimov.com/docs"
Source = "https://github.com/KIT-IAI-ESA/eCoSim"
Issues = "https://github.com/KIT-IAI-ESA/eCoSim/issues"
Changelog = "https://ecosim.easimov.com/docs/development/release-history"

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-timeout==2.4.0",
    "mypy==2.3.0",
    "uv==0.13.7",
]

[tool.mypy]
mypy_path = "../ecosim-common"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore art library (not typed)
    "art",
    # Ignore Pyro5 library (not typed)
    "Pyro5",
    "Pyro5.*",
    # mypy_path includes the sources of ecosim-common, so its untyped imports need the same overrides
    "cloudpickle",
    "cloudpickle.*",
    "dask",
    "dask.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
timeout = 120

[powerfactory]
project_name = Nine-bus System Master
study_case = 01- Load Flow
terminal_name = Bus 10
line_names = Line 5-10/1, Line 5-10/2
timestep = 25e-6
# Optional: set load operating point before load flow (leave empty to skip)
load_names = Load A
load_p_mw = 125.0
load_q_mvar = 50.0
# FMU-driven load halving: autonomous load-step detection
# fmu_power_key: key in input_dict that carries the FMU-computed power (MW)
# load_step_threshold_mw: min absolute change to count as a real step (not noise)
# Leave fmu_power_key empty to disable.
fmu_power_key = AP
load_step_threshold_mw = 2.0
# Skip the first N steps before checking for load steps (avoids false trigger from FMU startup transient)
load_step_min_step = 200
# Experimental: runtime ElmIac signal injection test
# Set to the loc_name of the AC current source object (ElmIac) in the network.
# Leave empty to disable the injection test.
current_source_name = AC Current Source

[pyro]
host = localhost
port = 9090
object_name = powerfactory

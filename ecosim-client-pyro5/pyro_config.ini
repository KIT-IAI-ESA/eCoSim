[powerfactory]
project_name = Nine-bus System Master
study_case = 01- Load Flow
terminal_name = Bus 10
line_names = Line 5-10/1, Line 5-10/2
# SYNC: Must match server (start_server.py --step-size 250 µs, --steps 2000)
# and FMU client (config_fmu.json fmu.step_size = 0.00025)
timestep = 25e-5
# Optional: set load operating point before load flow (leave empty to skip)
load_names = Load A
load_p_mw = 125.0
load_q_mvar = 50.0
# Timed load halving: halve load setpoints when simulation time reaches this value (seconds).
# Set to a negative value to disable.
load_change_time_s = 0.3
# DSL-based AC current source test: set ElmDsl/ElmMyd* parameters before ComInc.
# Leave dsl_signal_name empty to disable.
# dsl_signal_name: ElmDsl/ElmMyd* instance loc_name (e.g. 'DSL Model') or BlkDef type name (e.g. 'MyDSL')
dsl_signal_name = DSL Model
# ElmIac current source: read back m:I:A/B/C each step for logging/plotting.
# Leave empty to disable.
iac_source_name = Eingang Current
# Live DSL command interface: input_dict keys for per-step current injection
# The FMU outputs in A; the DSL model IA_cmd/IB_cmd/IC_cmd parameters are in kA.
# iac_current_scale = 1e-3  converts A → kA (default). Set to 1.0 if FMU already outputs kA.
iac_ia_cmd_key = Ia
iac_ib_cmd_key = Ib
iac_ic_cmd_key = Ic
iac_current_scale = 1e-3
# Verzögerte Einspeisung: Ströme werden erst ab diesem Zeitpunkt injiziert (Sekunden).
# Negativer Wert = sofort ab t=0. Beispiel: 0.1 = erste 100ms ohne Einspeisung.
iac_injection_start_time_s = 0.1


[pyro]
host = localhost
port = 9090
object_name = powerfactory

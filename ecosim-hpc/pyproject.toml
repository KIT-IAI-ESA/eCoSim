[project]
name = "ecosim-hpc"
version = "0.14.0"
description = "HPC interface for the eCoSim Project"
readme = "README.md"
authors = [
    { name = "Glen Hunter", email = "glen.hunter@kit.edu" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "dask[distributed]==2026.7.0",
    "dask-mpi==2026.3.0",
    "ecosim-client-fmu-v2==0.14.0",
    "ecosim-client-fmu-v3==0.14.0",
    "ecosim-client-matlab==0.14.0",
    "ecosim-common==0.14.0",
    "ecosim-server==0.14.0",
    "ecosim-client-pyro5==0.14.0",
    "fmpy==0.3.30",
]

[build-system]
requires = ["setuptools==84.2.1", "build"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }
ecosim-server = { path = "../ecosim-server", editable = true }
ecosim-client-fmu-v2 = { path = "../ecosim-client-fmu-v2", editable = true }
ecosim-client-fmu-v3 = { path = "../ecosim-client-fmu-v3", editable = true }
ecosim-client-matlab = { path = "../ecosim-client-matlab", editable = true }
ecosim-client-pyro5 = { path = "../ecosim-client-pyro5", editable = true }
ecosim-test-common = { path = "../ecosim-test-common", editable = true }

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "mypy==2.3.0",
    "uv==0.12.5",
    "dask-pyspy==0.4.0",
    "ecosim-test-common==0.14.0",
]

[project.urls]
Documentation = "https://mekkyz.github.io/ecosim-os/"
Source = "https://github.com/mekkyz/ecosim-os"
Issues = "https://github.com/mekkyz/ecosim-os/issues"
Changelog = "https://mekkyz.github.io/ecosim-os/development/release-history"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_hpc",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_hpc"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

[tool.mypy]
mypy_path = ["../ecosim-common", "../ecosim-common-fmpy", "../ecosim-server", "../ecosim-client-fmu-v2", "../ecosim-client-fmu-v3", "../ecosim-client-matlab", "../ecosim-client-pyro5","../ecosim-test-common",]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore fmpy library (not typed)
    "fmpy",
    "fmpy.*",
    # Ignore art library (not typed)
    "art",
    # Ignore matlab (not available in the CI)
    "matlab",
    "matlab.engine",
    "sqlalchemy",
    "sqlalchemy.*",
    # Ignore Pyro5 (not typed)
    "Pyro5",
    "Pyro5.*",
    # Ignore dask-mpi (not typed)
    "dask_mpi",
    "dask_mpi.*",
    "dask.distributed",
    "cloudpickle",
    "cloudpickle.*",
]
ignore_missing_imports = true

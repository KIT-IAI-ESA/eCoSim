[project]
name = "ecosim"
version = "0.14.0"
description = "The core eCoSim project "
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: Server",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pip==25.3", # PyCharm mypy plugin needs pip
    "ruff==0.14.4",
]

[project]
name = "ecosim-dev"
version = "0.14.0"
description = "The development tools of the eCoSim repository"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    # dev/tests read the workflow and the pre-commit config
    "pyyaml==6.0.3",
    "pip==26.3", # PyCharm mypy plugin needs pip
    "ruff==0.15.20",
    "uv==0.13.7",
]

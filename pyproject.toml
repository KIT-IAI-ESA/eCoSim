[project]
name = "ecosim"
version = "0.14.0"
description = "The core eCoSim project"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    # dev/tests read the workflow and the pre-commit config
    "pyyaml==6.0.3",
    "pip==26.3", # PyCharm mypy plugin needs pip
    "ruff==0.17.3",
    "uv==0.13.7",
]

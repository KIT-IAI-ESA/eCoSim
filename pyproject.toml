[project]
name = "ecosim"
version = "0.14.0"
description = "The core eCoSim project "
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: Server",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pip==26.1.2", # PyCharm mypy plugin needs pip
    "ruff==0.14.4",
    "uv==0.12.5",
]
doc = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

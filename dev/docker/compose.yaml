# Builds the eCoSim images. From this folder: docker compose build ecosim-server ecosim-client-fmu-v2
services:
  ecosim-server:
    image: localhost/ecosim-server:latest
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
      args:
        SOURCE_DIR: ecosim-server
        COMMAND_NAME: ecosim-server
  ecosim-client-fmu-v2:
    image: localhost/ecosim-client-fmu-v2:latest
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
      args:
        SOURCE_DIR: ecosim-client-fmu-v2
        COMMAND_NAME: ecosim-client-fmu-v2
  ecosim-client-fmu-v3:
    image: localhost/ecosim-client-fmu-v3:latest
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
      args:
        SOURCE_DIR: ecosim-client-fmu-v3
        COMMAND_NAME: ecosim-client-fmu-v3
  ecosim-client-matlab:
    image: localhost/ecosim-client-matlab:latest
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
      args:
        SOURCE_DIR: ecosim-client-matlab
        COMMAND_NAME: ecosim-client-matlab
        # the MATLAB engine supports only Python 3.12
        PYTHON_VERSION: "3.12"
  ecosim-client-pyro5:
    image: localhost/ecosim-client-pyro5:latest
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
      args:
        SOURCE_DIR: ecosim-client-pyro5
        COMMAND_NAME: ecosim-client-pyro5

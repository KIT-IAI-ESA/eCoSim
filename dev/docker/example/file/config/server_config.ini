[server]
# 0.0.0.0 so the clients in the compose network can reach the server
host=0.0.0.0
port=1234

[database]
# 'file' writes the results as JSON lines instead of connecting to a database
type=file
# the directory inside the server container - docker-compose.yml mounts it to ./results
directory=/results
# the file repository does not connect anywhere, but the keys below are still read - so they are kept empty
server=
port=0
username=
password=
ssl=false

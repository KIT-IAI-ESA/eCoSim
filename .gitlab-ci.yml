stages:
  - test
  - integration_test
  - artifacts

variables:
  SRC_DIR: "$CI_PROJECT_DIR"
  # Change pip's cache directory to be inside the project directory since we can
  # only cache local items.
  PIP_CACHE_DIR: "$GIT_CLONE_PATH/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - "$PIP_CACHE_DIR"
    - "$VENV_DIR"

.image-template:
  image: astral/uv:python3.13-trixie-slim

.sub-project-template:
  extends: .image-template
  parallel:
    matrix:
      - PROJECT_DIR:
          - $SRC_DIR/ecosim-common
          - $SRC_DIR/ecosim-client-fmu-v2
          - $SRC_DIR/ecosim-client-fmu-v3
          - $SRC_DIR/ecosim-server
  before_script:
    - cd ${PROJECT_DIR}

test:
  extends: .sub-project-template
  stage: test
  script:
    - uv sync --extra dev
    - uv run pytest

  # NOTE: the coverage is extracted from stdout - not from the file specified below
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $PROJECT_DIR/coverage.xml
      junit: $PROJECT_DIR/report.xml
    paths:
      - $PROJECT_DIR/coverage.xml
      - $PROJECT_DIR/report.xml
      - $PROJECT_DIR/htmlcov/
    when: always  # always = collect artifacts even if the job (i.e. the tests) fail

integration_test_ecosim:
  extends: .image-template
  stage: integration_test
  script:
    - cd $SRC_DIR/integration-tests
    - uv sync
    - uv run pytest
  artifacts:
    reports:
      junit: integration-tests/report.xml
    paths:
      - integration-tests/report.xml
    when: always  # always = collect artifacts even if the job (i.e. the tests) fail


publish_artifacts:
  extends: .sub-project-template
  stage: artifacts
  script:
    - cd $SRC_DIR/integration-tests
    - uv sync
    - uv build
    - uv publish \
      --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi \
      --username gitlab-ci-token \
      --password ${CI_JOB_TOKEN}
  artifacts:
    expire_in: 7 days
    paths:
      - $PROJECT_DIR/dist/*
#  rules:
#    - if: '$CI_COMMIT_BRANCH == "main"'
#      when: on_success
#  only:
#    - main

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-client-fmu-v2"
version = "0.14.0"
description = "The FMU v2 client for the eCoSim project"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: FMU client",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "art==6.5",
    "ecosim-common==0.14.0",
    "ecosim-common-fmpy==0.14.0",
    "setuptools==83.0.0",
    "fmpy==0.3.30",
    "pydantic==2.13.4",
    "pip==26.1.2",
]

[project.scripts]
ecosim-client-fmu-v2 = "ecosim_client_fmu_v2.main:main"

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }
ecosim-common-fmpy = { path = "../ecosim-common-fmpy", editable = true }
ecosim-test-common = { path = "../ecosim-test-common", editable = true }

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "mypy==2.3.0",
    "uv==0.12.5",
    "ecosim-test-common==0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_client_fmu_v2",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_client_fmu_v2"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

#[project.urls]
#Homepage = "https://github.com/yourusername/myapp"
#Repository = "https://github.com/yourusername/myapp"

[tool.mypy]
mypy_path = ["../ecosim-common","../ecosim-common-fmpy", "../ecosim-test-common"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore fmpy library (not typed)
    "fmpy",
    "fmpy.*",
    # Ignore art library (not typed)
    "art",
    "lxml",
]
ignore_missing_imports = true

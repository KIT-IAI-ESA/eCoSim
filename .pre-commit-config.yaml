repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        types: [text]
        exclude: /windows/.*\.ini$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [ '--max-line-length=150', '--extend-ignore=E128,E124,E131,E127,E122' ]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.0.3
    hooks:
      - id: editorconfig-checker
        # disable for python files since flake8 is already checking the linewidth
        exclude: ^(vendor/|node_modules/)|\.min\.js$|\.py$|\.fmc

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        types: [ text ]
        exclude: /windows/.*\.ini$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [ '--max-line-length=150', '--extend-ignore=E128,E124,E131,E127,E122' ]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.4.1
    hooks:
      - id: editorconfig-checker
        # disable for python files since flake8 is already checking the linewidth
        exclude: ^(vendor/|node_modules/)|\.min\.js$|\.py$|\.fmc

  - repo: local
    hooks:
      - id: mypy
        name: mypy (ecosim-common)
        entry: python dev/run_mypy.py ecosim-common
        language: system
        files: ^ecosim-common/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-server)
        entry: python dev/run_mypy.py ecosim-server
        language: system
        files: ^ecosim-server/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-matlab)
        entry: python dev/run_mypy.py ecosim-client-matlab
        language: system
        files: ^ecosim-client-matlab/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-fmu-v2)
        entry: python dev/run_mypy.py ecosim-client-fmu-v2
        language: system
        files: ^ecosim-client-fmu-v2/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-fmu-v3)
        entry: python dev/run_mypy.py ecosim-client-fmu-v3
        language: system
        files: ^ecosim-client-fmu-v3/
        pass_filenames: false
        types: [ python ]
      - id: check-py-filenames
        name: Check Python filenames are snake_case
        entry: python dev/validate_file_name.py
        language: system
        types: [ python ]
        files: .*\.py
        pass_filenames: true


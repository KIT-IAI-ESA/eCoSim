default_install_hook_types: [ pre-commit, commit-msg ]
default_stages: [ pre-commit ]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: .*\.iml$
      - id: end-of-file-fixer
        types: [ text ]
        exclude: ^(.*/windows/.*\.ini|.*\.iml)$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: [ '--maxkb=4096', '--enforce-all' ]

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        # disable for python files since ruff is already checking the linewidth
        exclude: ^(vendor/|node_modules/)|\.min\.js$|\.py$|\.iml$|\.fmc$

  - repo: local
    hooks:
      - id: mypy
        name: mypy (ecosim-common)
        entry: python dev/run_mypy.py ecosim-common
        language: system
        files: ^ecosim-common/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-common-fmpy)
        entry: python dev/run_mypy.py ecosim-common-fmpy
        language: system
        files: ^ecosim-common-fmpy/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-server)
        entry: python dev/run_mypy.py ecosim-server
        language: system
        files: ^ecosim-server/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-matlab)
        entry: python dev/run_mypy.py ecosim-client-matlab
        language: system
        files: ^ecosim-client-matlab/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-fmu-v2)
        entry: python dev/run_mypy.py ecosim-client-fmu-v2
        language: system
        files: ^ecosim-client-fmu-v2/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-fmu-v3)
        entry: python dev/run_mypy.py ecosim-client-fmu-v3
        language: system
        files: ^ecosim-client-fmu-v3/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-pyro5)
        entry: python dev/run_mypy.py ecosim-client-pyro5
        language: system
        files: ^ecosim-client-pyro5/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-client-python)
        entry: python dev/run_mypy.py ecosim-client-python
        language: system
        files: ^ecosim-client-python/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim)
        entry: python dev/run_mypy.py ecosim
        language: system
        # the next character of ecosim-server/ and the other subprojects is a hyphen
        files: ^ecosim/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-hpc)
        entry: python dev/run_mypy.py ecosim-hpc
        language: system
        files: ^ecosim-hpc/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (ecosim-test-common)
        entry: python dev/run_mypy.py ecosim-test-common
        language: system
        files: ^ecosim-test-common/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (integration-tests)
        entry: python dev/run_mypy.py integration-tests
        language: system
        files: ^integration-tests/
        pass_filenames: false
        types: [ python ]
      - id: mypy
        name: mypy (dev)
        entry: uv run --directory dev mypy --strict --ignore-missing-imports .
        language: system
        files: ^dev/
        pass_filenames: false
        types: [ python ]
      - id: check-py-filenames
        name: Check Python filenames are snake_case
        entry: python dev/validate_file_name.py
        language: system
        types: [ python ]
        files: .*\.py
        pass_filenames: true
      - id: check-commit-message
        name: Check commit message
        entry: python dev/check_commit_message.py
        language: python
        stages: [ commit-msg ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # its default dependencies include trove-classifiers, so unknown classifiers fail
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject
        files: (^|/)pyproject\.toml$

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.0
    hooks:
      - id: betterleaks
      # the whole history of every branch, run by dev/check_for_leaked_secrets.py
      - id: betterleaks
        alias: betterleaks-full-history
        name: Detect hardcoded secrets in the whole git history
        entry: betterleaks git --redact --verbose --log-opts=--all .
        stages: [ manual ]
      - id: betterleaks
        alias: betterleaks-with-unredacted-report
        name: Collect the leaks in the whole git history and create an unredacted report
        entry: betterleaks git --log-opts=--all --report-format=json --report-path=.betterleaks-report.json .
        stages: [ manual ]

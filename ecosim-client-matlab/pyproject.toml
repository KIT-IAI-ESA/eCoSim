[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-client-matlab"
version = "0.14.0"
description = "The matlab client for the eCoSim project"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: Matlab client",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "art==6.5",
    "ecosim-common==0.14.0",
    "pydantic==2.13.4",
]

[project.scripts]
ecosim-client-matlab = "ecosim_client_matlab.main:main"


[tool.uv]
python-downloads = "automatic"

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-timeout==2.4.0",
    "mypy==2.3.0",
    "uv==0.12.5",
    "pip==26.1.2",
]
R2024b = ["matlabengine==24.2.1"]

#[project.urls]
#Homepage = "https://github.com/yourusername/myapp"
#Repository = "https://github.com/yourusername/myapp"

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_client_matlab",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_client_matlab"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

[tool.mypy]
mypy_path = "../ecosim-common"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore fmpy library (not typed)
    "fmpy",
    "fmpy.*",
    # Ignore fmpy library (not typed)
    "art",
    # Ignore matlab (not available in the CI)
    "matlab",
    "matlab.engine",
    # mypy_path includes the sources of ecosim-common, so its untyped imports need the same overrides
    "cloudpickle",
    "cloudpickle.*",
    "dask",
    "dask.*",
]
ignore_missing_imports = true

[build-system]
requires = ["setuptools==83.0.0", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-common-fmpy"
version = "0.14.0"
description = "Common utilities and abstractions for the fmpy part of eCoSim"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fmpy==0.3.30",
    "ecosim-common==0.14.0",
]

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }

[tool.setuptools.package-data]
ecosim_common_fmpy = ["py.typed"]

[project.optional-dependencies]
dev = [
    "setuptools==83.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "mypy==2.3.0",
    "uv==0.12.5",
    "pip==26.1.2",
    "ruff==0.15.20",
]

[project.urls]
Documentation = "https://mekkyz.github.io/ecosim-os/"
Source = "https://github.com/mekkyz/ecosim-os"
Issues = "https://github.com/mekkyz/ecosim-os/issues"
Changelog = "https://mekkyz.github.io/ecosim-os/development/release-history"

[tool.mypy]
mypy_path = ["../ecosim-common"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore fmpy library (not typed)
    "fmpy",
    "fmpy.*",
    # Ignore lxml library (not typed)
    "lxml",
    "lxml.*",
    # mypy_path includes the sources of ecosim-common, so its untyped imports need the same overrides
    "cloudpickle",
    "cloudpickle.*",
    "dask",
    "dask.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_common_fmpy",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_common_fmpy"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

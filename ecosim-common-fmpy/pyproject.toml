[build-system]
requires = ["setuptools==84.2.1", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-common-fmpy"
version = "0.14.0"
description = "Common utilities and abstractions for the fmpy part of eCoSim"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
maintainers = [
    { name = "eASiMOV", email = "easimov@iai.kit.edu" }
]
dynamic = ["readme"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fmpy==0.3.30",
    "ecosim-common==0.14.0",
]

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }
ecosim-test-common = { path = "../ecosim-test-common", editable = true }

[tool.setuptools.package-data]
ecosim_common_fmpy = ["py.typed"]

[project.optional-dependencies]
dev = [
    "setuptools==84.2.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-timeout==2.4.0",
    "mypy==2.3.0",
    "uv==0.13.7",
    "pip==26.3",
    "ruff==0.15.20",
    "ecosim-test-common==0.14.0",
]

[project.urls]
Documentation = "https://ecosim.easimov.com/docs"
Source = "https://github.com/KIT-IAI-ESA/eCoSim"
Issues = "https://github.com/KIT-IAI-ESA/eCoSim/issues"
Changelog = "https://ecosim.easimov.com/docs/development/release-history"

[tool.mypy]
mypy_path = ["../ecosim-common", "../ecosim-test-common"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore fmpy library (not typed)
    "fmpy",
    "fmpy.*",
    # Ignore lxml library (not typed)
    "lxml",
    "lxml.*",
    # mypy_path includes the sources of ecosim-common, so its untyped imports need the same overrides
    "cloudpickle",
    "cloudpickle.*",
    "dask",
    "dask.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_common_fmpy",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_common_fmpy"]
omit = ["*/tests/*"]

# on PyPI the note is shown above the actual README.md
[tool.setuptools.dynamic]
readme = { file = ["PYPI_NOTE.md", "README.md"], content-type = "text/markdown" }

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-cli"
version = "0.14.0"
description = "The ecosim command to write, check and run a simulation locally"
maintainers = [
    { name = "eASiMOV", email = "easimov@iai.kit.edu" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ecosim-client-fmu-v2==0.14.0",
    "ecosim-client-fmu-v3==0.14.0",
    "ecosim-client-python==0.14.0",
    "ecosim-common==0.14.0",
    "ecosim-common-fmpy==0.14.0",
    "ecosim-server==0.14.0",
]

[project.optional-dependencies]
pyro5 = ["ecosim-client-pyro5==0.14.0"]
pandas = ["ecosim-server[pandas]==0.14.0"]
dev = [
    "ecosim-test-common==0.14.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "uv==0.13.7",
]

[project.scripts]
ecosim = "ecosim.main:main"

[project.urls]
Documentation = "https://ecosim.easimov.com/docs"
Source = "https://github.com/KIT-IAI-ESA/eCoSim"
Issues = "https://github.com/KIT-IAI-ESA/eCoSim/issues"
Changelog = "https://ecosim.easimov.com/docs/development/release-history"

[tool.setuptools.package-data]
ecosim = ["py.typed"]

[tool.uv.sources]
ecosim-client-fmu-v2 = { path = "../ecosim-client-fmu-v2", editable = true }
ecosim-client-fmu-v3 = { path = "../ecosim-client-fmu-v3", editable = true }
ecosim-client-pyro5 = { path = "../ecosim-client-pyro5", editable = true }
ecosim-client-python = { path = "../ecosim-client-python", editable = true }
ecosim-common = { path = "../ecosim-common", editable = true }
ecosim-common-fmpy = { path = "../ecosim-common-fmpy", editable = true }
ecosim-server = { path = "../ecosim-server", editable = true }
ecosim-test-common = { path = "../ecosim-test-common", editable = true }

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim"]
omit = ["*/tests/*"]

[tool.mypy]
mypy_path = [
    "../ecosim-common",
    "../ecosim-common-fmpy",
    "../ecosim-server",
    "../ecosim-client-fmu-v2",
    "../ecosim-client-fmu-v3",
    "../ecosim-client-python",
    "../ecosim-test-common",
]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # mypy_path includes the sources of the packages ecosim runs, so their untyped imports need the same overrides
    "art",
    "cloudpickle",
    "cloudpickle.*",
    "dask",
    "dask.*",
    "distributed.*",
    "fmpy",
    "fmpy.*",
    "lxml",
    "lxml.*",
    "pandas",
    "pandas.*",
    "sqlalchemy",
    "sqlalchemy.*",
]
ignore_missing_imports = true

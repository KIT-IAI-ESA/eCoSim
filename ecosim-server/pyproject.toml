[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-server"
requires-python = ">=3.12"
version = "0.14.0"
description = "The server to handle the eCoSim clients"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ecosim-common==0.14.0",
    "art==6.5",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
ecosim-server = "ecosim_server.main:main"

[tool.setuptools.package-data]
ecosim_server = ["py.typed"]

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }
ecosim-test-common = { path = "../ecosim-test-common", editable = true }

[project.optional-dependencies]
dev = [
    "ecosim-test-common==0.14.0",
    "mypy==2.3.0",
    "pip==26.3",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest==9.1.1",
    "setuptools==84.2.1",
    "uv==0.13.7",
]

[project.urls]
Documentation = "https://ecosim.easimov.com/docs"
Source = "https://github.com/KIT-IAI-ESA/eCoSim"
Issues = "https://github.com/KIT-IAI-ESA/eCoSim/issues"
Changelog = "https://ecosim.easimov.com/docs/development/release-history"

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_server",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_server"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

[tool.mypy]
mypy_path = ["../ecosim-common", "../ecosim-test-common"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # Ignore fmpy library (not typed)
    "fmpy",
    "fmpy.*",
    # Ignore art library (not typed)
    "art",
    "sqlalchemy",
    "dask.distributed",
    "distributed.protocol",
    "cloudpickle",
    "cloudpickle.*",
]
ignore_missing_imports = true

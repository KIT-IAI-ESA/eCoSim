[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-server"
requires-python = ">=3.13"
version = "0.11.0"
description = "The server to handle the eCoSim clients"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: Server",
#    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ecosim-common>=0.11.0",
    "art==6.5",
    "pydantic==2.11.9",
    "sqlalchemy==2.0.41",
    "psycopg2-binary==2.9.10",
]

[tool.uv.sources]
ecosim-common = { path = "../ecosim-common", editable = true }


[project.optional-dependencies]
dev = [
    "setuptools==80.9.0",
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "pytest-html==4.1.1",
    "mypy==1.18.2",
    "uv==0.8.22",
]

#[project.urls]
#Homepage = "https://github.com/yourusername/myapp"
#Repository = "https://github.com/yourusername/myapp"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_server",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_server"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

[tool.mypy]
mypy_path = "../ecosim-common"
# Ignore fmpy library (not typed)
[[tool.mypy.overrides]]
module = [
    "fmpy",
    "fmpy.*",
    "art",
]
ignore_missing_imports = true

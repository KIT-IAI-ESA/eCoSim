[build-system]
requires = ["setuptools==83.0.0", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-common"
version = "0.14.0"
description = "Common utilities and abstractions for eCoSim"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: Common Code",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "art==6.5",
    "pydantic==2.13.4",
    "websockets==16.0",
    "dask[distributed]==2026.7.0",
]

[tool.setuptools.package-data]
ecosim_common = ["py.typed"]

[project.optional-dependencies]
dev = [
    "setuptools==83.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "mypy==2.3.0",
    "uv==0.12.5",
    "pip==26.1.2",
    "pytest-mock==3.15.1",
]

#[project.urls]
#Homepage = "https://github.com/yourusername/myapp"
#Repository = "https://github.com/yourusername/myapp"

[tool.mypy]
mypy_path = ["../ecosim-test-common", "../ecosim-server"]
python_executable = ".venv/bin/python"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # dask is only typed partly
    "dask",
    "dask.distributed",
    "dask.distributed.*",
    "dask.*",
    "cloudpickle",
    "cloudpickle.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_common",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_common"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

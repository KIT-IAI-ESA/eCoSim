[build-system]
requires = ["setuptools==84.2.1", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-common"
version = "0.14.0"
description = "Common utilities and abstractions for eCoSim"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "art==6.5",
    "pydantic==2.14.3",
    "websockets==17.4",
    "dask[distributed]==2026.7.0",
]

[tool.setuptools.package-data]
ecosim_common = ["py.typed"]

[project.optional-dependencies]
dev = [
    "ecosim-test-common==0.14.0",
    "mypy==2.3.0",
    "pip==26.1.2",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-mock==3.15.1",
    "pytest==9.1.1",
    "setuptools==84.2.1",
    "uv==0.12.5",
]

[project.urls]
Documentation = "https://mekkyz.github.io/ecosim-os/"
Source = "https://github.com/mekkyz/ecosim-os"
Issues = "https://github.com/mekkyz/ecosim-os/issues"
Changelog = "https://mekkyz.github.io/ecosim-os/development/release-history"

[tool.uv.sources]
ecosim-test-common = { path = "../ecosim-test-common", editable = true }

[tool.mypy]
mypy_path = ["../ecosim-test-common"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # dask is only typed partly
    "dask",
    "dask.distributed",
    "dask.distributed.*",
    "dask.*",
    "cloudpickle",
    "cloudpickle.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_common",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_common"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

[build-system]
requires = ["setuptools==80.9.0", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim-common"
version = "0.13.0"
description = "Common utilities and abstractions for eCoSim"
authors = [
    { name = "Maurice Mueller", email = "maurice.mueller@bitraven.de" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: eCoSim :: Common Code",
    #    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "art==6.5",
    "pydantic==2.12.4",
    "websockets==15.0.1",
    "dask==2025.10.0",
    "dask[distributed]==2025.10.0",
]

[tool.setuptools.package-data]
ecosim_common = ["py.typed"]

[project.optional-dependencies]
dev = [
    "setuptools==80.9.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-html==4.1.1",
    "mypy==1.18.2",
    "uv==0.9.6",
    "pip==25.3"
]

#[project.urls]
#Homepage = "https://github.com/yourusername/myapp"
#Repository = "https://github.com/yourusername/myapp"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # both packages are only typed partly
    "dask", "dask.distributed"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ecosim_common",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--junitxml=report.xml",
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["ecosim_common"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = []

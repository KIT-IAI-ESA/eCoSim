version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
    ignore:
      # Docusaurus 3 does not work with TypeScript 7 yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

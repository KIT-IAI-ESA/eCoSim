name: commit messages

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PR_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            revisions=$PR_RANGE
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            revisions=$BEFORE..$AFTER
          else
            # new branch or force push: only commits that no other branch has
            revisions="$AFTER $(git rev-parse --not --exclude="origin/$BRANCH" --exclude=origin/HEAD --remotes=origin)"
          fi
          python3 dev/check_commit_message.py --revisions $revisions

name: performance tests

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # every run on main has a group of its own, so it is never cancelled
  group: performance-tests-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      # the results are compared with the latest committed result of this machine
      ECOSIM_PERFORMANCE_MACHINE: github_ci_default
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: integration-tests-py${{ env.UV_PYTHON }}
      - name: Sync
        working-directory: integration-tests
        run: uv sync --locked
      - name: Test
        run: uv run --no-project python dev/run_performance_tests.py
      # shows the performance summary on the page of the workflow run
      - name: Summary
        if: always()
        run: |
          shopt -s nullglob
          summaries=(integration-tests/integration_tests/resources/performance/actual/*_github_ci_default_results.log)
          if [ ${#summaries[@]} -eq 0 ]; then
            echo "No performance summary was written, see the log of the step 'Test'." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo '```'; cat "${summaries[@]}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-tests
          path: |
            integration-tests/report.xml
            integration-tests/integration_tests/resources/performance/actual/*_github_ci_default.jsonl
            integration-tests/integration_tests/resources/performance/actual/*_github_ci_default_results.log
          if-no-files-found: ignore
          retention-days: 30

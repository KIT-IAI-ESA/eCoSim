name: windows tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # every run on main has a group of its own, so it is never cancelled
  group: windows-tests-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

# not a required check: a failed Windows test makes this run red, but does not block a merge
jobs:
  windows-unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - ecosim-common
          - ecosim-server
          - ecosim-client-fmu-v2
          - ecosim-client-fmu-v3
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          cache-suffix: ${{ matrix.project }}-py${{ env.UV_PYTHON }}
      - name: Sync
        working-directory: ${{ matrix.project }}
        run: uv sync --locked --extra dev
      - name: Test
        timeout-minutes: 20
        run: uv run --no-project python dev/run_unit_tests.py ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-unit-tests-${{ matrix.project }}
          path: ${{ matrix.project }}/report.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-end-to-end-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          cache-suffix: integration-tests-py${{ env.UV_PYTHON }}
      - name: Test
        timeout-minutes: 10
        working-directory: integration-tests
        run: uv run --locked pytest integration_tests/server_client/test_three_client_server.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-end-to-end-test
          path: integration-tests/report.xml
          if-no-files-found: ignore
          retention-days: 14

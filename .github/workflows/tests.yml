name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # every run on main has a group of its own, so it is never cancelled
  group: tests-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # the local hooks call a plain `python`
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: pre-commit
      # --locked also checks ecosim-test-common/uv.lock, which no other job syncs
      - name: Sync every subproject
        run: python dev/sync_projects.py --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run every hook
        run: uv run pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - ecosim-common
          - ecosim-common-fmpy
          - ecosim-server
          - ecosim-client-fmu-v2
          - ecosim-client-fmu-v3
          - ecosim-client-matlab
          - ecosim-client-pyro5
          - ecosim-hpc
        python: [ "3.12", "3.14" ]
        exclude:
          # the MATLAB engine supports only Python 3.12, and ecosim-hpc depends on the MATLAB client
          - project: ecosim-client-matlab
            python: "3.14"
          - project: ecosim-hpc
            python: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: ${{ matrix.project }}-py${{ matrix.python }}
      - name: Sync
        working-directory: ${{ matrix.project }}
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run --no-project python dev/run_tests.py ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-tests-${{ matrix.project }}-py${{ matrix.python }}
          path: |
            ${{ matrix.project }}/report.xml
            ${{ matrix.project }}/coverage.xml
            ${{ matrix.project }}/htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: integration-tests-py${{ env.UV_PYTHON }}
      # the tests under locally/ need external models or an HPC environment;
      # the tests marked 'performance' run in performance-tests.yml
      - name: Test
        working-directory: integration-tests
        run: uv run --locked pytest --ignore=integration_tests/locally -m integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-tests
          path: integration-tests/report.xml
          if-no-files-found: ignore
          retention-days: 14

  leaked-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # the scan needs the whole history and the remote branches
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: leaked-secrets
      - name: Install pre-commit
        run: uv sync --locked --extra dev
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Scan the whole history
        run: uv run --no-project python dev/check_for_leaked_secrets.py

  dev-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: dev-scripts
      - name: Test
        run: uv run --locked --extra dev pytest dev/tests

  # the ruleset requires only this job, so new jobs just go into its needs
  tests-passed:
    if: always()
    needs: [ pre-commit, unit-tests, integration-tests, leaked-secrets, dev-scripts ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

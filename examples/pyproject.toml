[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "examples"
version = "0.0.1"
description = "For setting python environment for simulation examples"
authors = [
    { name = "Alexander Kocher", email = "alexander.kocher@kit.edu"},
    { name = "Glen Hunter", email = "glen.hunter@kit.edu"}
]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "ecosim==0.14.0",
    "ecosim-client-fmu-v2==0.14.0",
    "ecosim-client-python==0.14.0",
    "ecosim-common==0.14.0",
    "ecosim-server==0.14.0",
    "ecosim-hpc==0.14.0",
    "mypy==2.3.0",
    "websockets==16.0",
]

[tool.setuptools]
py-modules=[]

[tool.uv.sources]
ecosim = { path = "../ecosim-cli", editable = true }
ecosim-common = { path = "../ecosim-common", editable = true }
ecosim-server = { path = "../ecosim-server", editable = true }
ecosim-client-fmu-v2 = { path = "../ecosim-client-fmu-v2", editable = true }
ecosim-client-python = { path = "../ecosim-client-python", editable = true }
ecosim-hpc = { path = "../ecosim-hpc", editable = true }

[tool.mypy]
mypy_path = ["../ecosim-cli", "../ecosim-common", "../ecosim-server", "../ecosim-client-python", "../ecosim-hpc"]

# This file is only for the IDE.
# E.g., in PyCharm: Settings -> Tools -> MyPy -> Config File
[mypy]
mypy_path = ecosim-common,ecosim-server,ecosim-client-fmu-v3,ecosim-client-fmu-v2,ecosim-client-matlab,ecosim-hpc,ecosim-common-fmpy,ecosim-client-pyro5
;mypy_path = ecosim-common/ecosim_common,ecosim-server/ecosim_server,ecosim-client-fmu-v3/ecosim_client_fmu_v3,ecosim-client-fmu-v2/ecosim_client_fmu_v2,ecosim-client-matlab/ecosim_client_matlab,ecosim-hpc/ecosim_hpc,ecosim-common-fmpy/ecosim_common_fmpy,ecosim-client-pyro5/ecosim_client_pyro5
check_untyped_defs = True
disallow_untyped_defs = True
explicit_package_bases = True
namespace_packages = True


; art library is not typed -> this will be globally ignored
[mypy-art]
ignore_missing_imports = True

; pyro5 library is not typed -> this will be globally ignored
[mypy-Pyro5]
ignore_missing_imports = True
[mypy-Pyro5.api]
ignore_missing_imports = True

; fmpy library is not typed -> this will be globally ignored
[mypy-fmpy]
ignore_missing_imports = True
[mypy-fmpy.*]
ignore_missing_imports = True

; sqlalchemy library is not typed -> this will be globally ignored
[mypy-sqlalchemy]
ignore_missing_imports = True
[mypy-sqlalchemy.*]
ignore_missing_imports = True

; psycopg library is not properly typed -> this will be globally ignored
[mypy-psycopg]
ignore_missing_imports = True
[mypy-psycopg.*]
ignore_missing_imports = True

; testcontainers library is not properly typed -> this will be globally ignored
[mypy-testcontainers.*]
ignore_missing_imports = True

; lxml library is not properly typed -> this will be globally ignored
[mypy-lxml]
ignore_missing_imports = True

; dask library is not properly typed -> this will be globally ignored
[mypy-dask]
ignore_missing_imports = True
[mypy-dask.distributed]
ignore_missing_imports = True

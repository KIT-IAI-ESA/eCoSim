[mypy]
mypy_path = ecosim-common,ecosim-server,ecosim-client-fmu-v3,ecosim-client-fmu-v2,ecosim-client-matlab
check_untyped_defs = True
disallow_untyped_defs = True


; art library is not typed -> this will be globally ignored
[mypy-art]
ignore_missing_imports = True

; pyro5 library is not typed -> this will be globally ignored
[mypy-Pyro5]
ignore_missing_imports = True
[mypy-Pyro5.api]
ignore_missing_imports = True

; fmpy library is not typed -> this will be globally ignored
[mypy-fmpy]
ignore_missing_imports = True
[mypy-fmpy.*]
ignore_missing_imports = True

; sqlalchemy library is not typed -> this will be globally ignored
[mypy-sqlalchemy]
ignore_missing_imports = True

services:
  opencode-kit:
    build: .
    container_name: ecosim-opencode-kit
    userns_mode: keep-id
    user: node
    volumes:
      - ../agent_prompts:/home/node/.config/opencode/agent_prompts:ro,z
      - ./opencode.kit.json:/home/node/.config/opencode/opencode.json:ro,z
      - ./opencode-auth.kit.json:/home/node/.local/share/opencode/auth.json:ro,z
      - ../../:/home/node/ecosim:z
    working_dir: /home/node/ecosim
    ports:
      - 29333:29333
  opencode-custom:
    build: .
    container_name: ecosim-opencode-custom
    userns_mode: keep-id
    user: node
    volumes:
      - ../agent_prompts:/home/node/.config/opencode/agent_prompts:ro,z
      - ./opencode.custom.json:/home/node/.config/opencode/opencode.json:ro,z
      - ./opencode-auth.custom.json:/home/node/.local/share/opencode/auth.json:ro,z
      - ../../:/home/node/ecosim:z
      - opencode-custom-data:/home/node/.local/share/opencode
      - opencode-custom-config:/home/node/.config/opencode
      - opencode-custom-cache:/home/node/.cache/opencode
    working_dir: /home/node/ecosim
    ports:
      - 29334:29333


volumes:
  opencode-kit-data:
    name: ecosim-opencode-kit-data
  opencode-kit-config:
    name: ecosim-opencode-kit-config
  opencode-kit-cache:
    name: ecosim-opencode-kit-cache
  opencode-custom-data:
    name: ecosim-opencode-custom-data
  opencode-custom-config:
    name: ecosim-opencode-custom-config
  opencode-custom-cache:
    name: ecosim-opencode-custom-cache

services:
  opencode:
    build: .
    container_name: opencode-ecosim
    volumes:
      - ./agent_prompts:/home/opencode/.config/opencode/agent_prompts:ro,Z
      - ./opencode.json:/home/opencode/.config/opencode/opencode.json:ro,Z
      - ./opencode-auth.json:/home/opencode/.local/share/opencode/auth.json:ro,Z
      - ../:/home/opencode/ecosim:Z
    working_dir: /home/opencode/ecosim
    ports:
      - 29333:29333
